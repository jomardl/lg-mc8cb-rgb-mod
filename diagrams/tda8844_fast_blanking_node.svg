<svg xmlns="http://www.w3.org/2000/svg" width="680" height="545" viewBox="0 0 680 545" role="img">
<title>TDA8844 fast blanking node on the LG MC-8CB</title>
<desc>Four drivers share one node: Q512 from the OSD, D508 from teletext, R557 from SCART, and a new switch with 6.2k from the 8V rail. R535 1.5k pulls the node to ground. Pin 26 voltage selects internal picture below 0.4V, external RGB from 0.9 to 3V, blanked outputs above 4V.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.t{font-size:14px;fill:#3D3D3A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#3D3D3A}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#2C2C2A}
.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#04342C}
.c-teal .ts{fill:#0F6E56}
</style>
<rect width="680" height="545" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="320" y1="110" x2="320" y2="410" stroke="#5F5E5A" stroke-width="1.5"/>
<g class="c-gray"><rect x="40" y="92" width="150" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="115" y="115" text-anchor="middle">osd-fb from uC</text></g>
<line x1="190" y1="110" x2="243" y2="110" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="255" y="76" text-anchor="middle">8V</text>
<line x1="255" y1="82" x2="255" y2="98" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="255" cy="110" r="12" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<line x1="267" y1="110" x2="320" y2="110" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="320" cy="110" r="3" fill="#5F5E5A"/>
<text class="ts" x="255" y="140" text-anchor="middle">Q512</text>
<g class="c-gray"><rect x="40" y="172" width="150" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="115" y="195" text-anchor="middle">txt-fb, P702 pin 1</text></g>
<line x1="190" y1="190" x2="250" y2="190" stroke="#5F5E5A" stroke-width="1"/>
<path d="M250 182 L266 190 L250 198 Z" fill="#5F5E5A"/>
<line x1="266" y1="181" x2="266" y2="199" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="266" y1="190" x2="320" y2="190" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="320" cy="190" r="3" fill="#5F5E5A"/>
<text class="ts" x="258" y="218" text-anchor="middle">D508</text>
<g class="c-gray"><rect x="40" y="252" width="150" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="115" y="275" text-anchor="middle">ext-fb, scart pin 16</text></g>
<line x1="190" y1="270" x2="240" y2="270" stroke="#5F5E5A" stroke-width="1"/>
