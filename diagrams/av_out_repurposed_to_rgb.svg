<svg xmlns="http://www.w3.org/2000/svg" width="680" height="415" viewBox="0 0 680 415" role="img">
<title>Repurposing the AV monitor-out jacks as RGB inputs (MC-8CB)</title>
<desc>Each monitor-out RCA jack is isolated by removing its series part, then linked on the PJ201 SCART footprint: pad 19 to 15, pad 3 to 11, pad 1 to 7. The existing 75 ohm terminations and 1.5k series resistors then feed pins 23, 24 and 25 of IC512.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.t{font-size:14px;fill:#3D3D3A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#3D3D3A}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#2C2C2A}
.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#04342C}
.c-teal .ts{fill:#0F6E56}
</style>
<rect width="680" height="415" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="520" y="95" width="125" height="265" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
