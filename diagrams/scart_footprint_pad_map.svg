<svg xmlns="http://www.w3.org/2000/svg" width="680" height="462" viewBox="0 0 680 462" role="img">
<title>PJ201 SCART footprint: pad map and the three RGB links</title>
<desc>Logical map of the SCART footprint. Even row carries R-IN pad 2, L-IN pad 6, AV-ID pad 8, EXT-FB pad 16 with R234 unfitted, and VIDEO01 pad 20 terminated by R236. Odd row carries R-OUT pad 1, L-OUT pad 3, EXT-B pad 7, EXT-G pad 11 and EXT-R pad 15 each with a 75 ohm termination, and V-OUT pad 19. Removing R235, C232 and C231 isolates pads 19, 3 and 1, which are then linked to pads 15, 7 and 11.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.t{font-size:14px;fill:#3D3D3A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#3D3D3A}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#2C2C2A}
.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#04342C}
.c-teal .ts{fill:#0F6E56}
</style>
<rect width="680" height="462" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="90" y="112" text-anchor="middle">R-IN</text>
<circle cx="90" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="90" y="134" text-anchor="middle">2</text>
<text class="ts" x="146" y="112" text-anchor="middle">gnd</text>
<circle cx="146" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="146" y="134" text-anchor="middle">4</text>
<text class="ts" x="202" y="112" text-anchor="middle">L-IN</text>
<circle cx="202" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="202" y="134" text-anchor="middle">6</text>
<text class="ts" x="258" y="112" text-anchor="middle">AV-ID</text>
<circle cx="258" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="258" y="134" text-anchor="middle">8</text>
<circle cx="314" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="314" y="134" text-anchor="middle">10</text>
<circle cx="370" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="370" y="134" text-anchor="middle">12</text>
<text class="ts" x="426" y="112" text-anchor="middle">gnd</text>
<circle cx="426" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="426" y="134" text-anchor="middle">14</text>
<text class="ts" x="482" y="112" text-anchor="middle">EXT-FB</text>
<text class="ts" x="482" y="98" text-anchor="middle">no R234</text>
<circle cx="482" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="482" y="134" text-anchor="middle">16</text>
<text class="ts" x="538" y="112" text-anchor="middle">gnd</text>
<circle cx="538" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="538" y="134" text-anchor="middle">18</text>
<text class="ts" x="594" y="112" text-anchor="middle">VIDEO01</text>
<text class="ts" x="594" y="98" text-anchor="middle">R236 75R</text>
<circle cx="594" cy="130" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="594" y="134" text-anchor="middle">20</text>
<line x1="90" y1="201" x2="90" y2="180" stroke="#5F5E5A" stroke-width="1"/>
<rect x="68" y="160" width="44" height="20" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="70" y1="162" x2="110" y2="178" stroke="#D85A30" stroke-width="1.5"/>
<line x1="110" y1="162" x2="70" y2="178" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="90" y="154" text-anchor="middle">C231</text>
<line x1="146" y1="201" x2="146" y2="180" stroke="#5F5E5A" stroke-width="1"/>
<rect x="124" y="160" width="44" height="20" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="126" y1="162" x2="166" y2="178" stroke="#D85A30" stroke-width="1.5"/>
<line x1="166" y1="162" x2="126" y2="178" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="146" y="154" text-anchor="middle">C232</text>
<line x1="594" y1="201" x2="594" y2="180" stroke="#5F5E5A" stroke-width="1"/>
<rect x="572" y="160" width="44" height="20" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="574" y1="162" x2="614" y2="178" stroke="#D85A30" stroke-width="1.5"/>
<line x1="614" y1="162" x2="574" y2="178" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="594" y="154" text-anchor="middle">R235</text>
<circle cx="90" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="90" y="214" text-anchor="middle">1</text>
<text class="ts" x="90" y="236" text-anchor="middle">R-OUT</text>
<circle cx="146" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="146" y="214" text-anchor="middle">3</text>
<text class="ts" x="146" y="236" text-anchor="middle">L-OUT</text>
<circle cx="202" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="202" y="214" text-anchor="middle">5</text>
<text class="ts" x="202" y="236" text-anchor="middle">gnd</text>
<circle cx="258" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="258" y="214" text-anchor="middle">7</text>
<text class="ts" x="258" y="236" text-anchor="middle">EXT-B</text>
<circle cx="314" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="314" y="214" text-anchor="middle">9</text>
<text class="ts" x="314" y="236" text-anchor="middle">gnd</text>
<circle cx="370" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="370" y="214" text-anchor="middle">11</text>
<text class="ts" x="370" y="236" text-anchor="middle">EXT-G</text>
<circle cx="426" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="426" y="214" text-anchor="middle">13</text>
<text class="ts" x="426" y="236" text-anchor="middle">gnd</text>
<circle cx="482" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="482" y="214" text-anchor="middle">15</text>
<text class="ts" x="482" y="236" text-anchor="middle">EXT-R</text>
<circle cx="538" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="538" y="214" text-anchor="middle">17</text>
<text class="ts" x="538" y="236" text-anchor="middle">gnd</text>
<circle cx="594" cy="210" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="594" y="214" text-anchor="middle">19</text>
<text class="ts" x="594" y="236" text-anchor="middle">V-OUT</text>
<path d="M594 219 L594 222 L566 222 L566 290 L510 290 L510 222 L482 222 L482 219" fill="none" stroke="#D85A30" stroke-width="2"/>
<text class="ts" x="538" y="306" text-anchor="middle">red</text>
<path d="M146 219 L146 222 L174 222 L174 340 L230 340 L230 222 L258 222 L258 219" fill="none" stroke="#D85A30" stroke-width="2"/>
<text class="ts" x="202" y="356" text-anchor="middle">blue</text>
<path d="M90 219 L90 222 L118 222 L118 388 L342 388 L342 222 L370 222 L370 219" fill="none" stroke="#D85A30" stroke-width="2"/>
<text class="ts" x="230" y="404" text-anchor="middle">green</text>
<line x1="150" y1="440" x2="174" y2="440" stroke="#D85A30" stroke-width="2"/>
<text class="ts" x="180" y="444">insulated link to add</text>
<line x1="330" y1="434" x2="346" y2="446" stroke="#D85A30" stroke-width="1.5"/>
<line x1="346" y1="434" x2="330" y2="446" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="354" y="444">remove to isolate the pad</text>
</svg>
