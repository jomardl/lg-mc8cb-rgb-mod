<rect x="323" y="320" width="14" height="26" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="345" y="338">R231</text>
<line x1="330" y1="346" x2="330" y2="352" stroke="#5F5E5A" stroke-width="1"/>
<line x1="322" y1="352" x2="338" y2="352" stroke="#5F5E5A" stroke-width="1"/>
<line x1="325" y1="356" x2="335" y2="356" stroke="#5F5E5A" stroke-width="1"/>
<line x1="327" y1="360" x2="333" y2="360" stroke="#5F5E5A" stroke-width="1"/>
<line x1="330" y1="310" x2="400" y2="310" stroke="#5F5E5A" stroke-width="1"/>
<rect x="400" y="302" width="56" height="16" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="428" y="294" text-anchor="middle">R534</text>
<line x1="456" y1="310" x2="520" y2="310" stroke="#5F5E5A" stroke-width="1"/>

<line x1="40" y1="392" x2="64" y2="392" stroke="#D85A30" stroke-width="2"/>
<text class="ts" x="70" y="396">link to add</text>
<line x1="170" y1="386" x2="186" y2="398" stroke="#D85A30" stroke-width="1.5"/>
<line x1="186" y1="386" x2="170" y2="398" stroke="#D85A30" stroke-width="1.5"/>
