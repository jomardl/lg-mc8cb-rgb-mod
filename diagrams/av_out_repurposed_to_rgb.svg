<text class="ts" x="250" y="140" text-anchor="middle">19</text>
<line x1="250" y1="150" x2="330" y2="150" stroke="#D85A30" stroke-width="2"/>
<circle cx="330" cy="150" r="3" fill="#5F5E5A"/>
