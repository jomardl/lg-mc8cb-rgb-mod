<line x1="330" y1="230" x2="400" y2="230" stroke="#5F5E5A" stroke-width="1"/>
<rect x="400" y="222" width="56" height="16" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
