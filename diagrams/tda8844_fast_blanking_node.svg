<line x1="312" y1="462" x2="328" y2="462" stroke="#5F5E5A" stroke-width="1"/>
<line x1="315" y1="466" x2="325" y2="466" stroke="#5F5E5A" stroke-width="1"/>
<line x1="317" y1="470" x2="323" y2="470" stroke="#5F5E5A" stroke-width="1"/>
<rect x="360" y="392" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="410" y="415" text-anchor="middle">pin 26, IC512</text>
<text class="ts" x="565" y="98" text-anchor="middle">voltage at pin 26</text>
<g class="c-gray"><rect x="490" y="110" width="150" height="80" rx="8" stroke-width="0.5"/><text class="th" x="565" y="138" text-anchor="middle">4 V and up</text><text class="ts" x="565" y="158" text-anchor="middle">outputs blanked</text><text class="ts" x="565" y="174" text-anchor="middle">for osd overlay</text></g>
<g class="c-teal"><rect x="490" y="210" width="150" height="80" rx="8" stroke-width="0.5"/><text class="th" x="565" y="238" text-anchor="middle">0.9 to 3 V</text><text class="ts" x="565" y="258" text-anchor="middle">external rgb in</text><text class="ts" x="565" y="274" text-anchor="middle">1.45 V lands here</text></g>
<g class="c-gray"><rect x="490" y="310" width="150" height="80" rx="8" stroke-width="0.5"/><text class="th" x="565" y="340" text-anchor="middle">0 to 0.4 V</text><text class="ts" x="565" y="362" text-anchor="middle">internal picture</text></g>
<line x1="40" y1="505" x2="64" y2="505" stroke="#D85A30" stroke-width="1"/>
