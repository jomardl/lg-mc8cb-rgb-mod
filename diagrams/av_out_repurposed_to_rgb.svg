<rect x="323" y="160" width="14" height="26" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="345" y="178">R233</text>
<line x1="330" y1="186" x2="330" y2="192" stroke="#5F5E5A" stroke-width="1"/>
