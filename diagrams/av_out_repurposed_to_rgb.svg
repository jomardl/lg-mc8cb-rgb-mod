<text class="ts" x="532" y="154">23  red</text>
<text class="ts" x="532" y="234">24  grn</text>
<text class="ts" x="532" y="314">25  blu</text>
<rect x="40" y="138" width="54" height="24" rx="4" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="67" y="154" text-anchor="middle">V-OUT</text>
<line x1="94" y1="150" x2="250" y2="150" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="150" cy="150" r="2.5" fill="#5F5E5A"/>
<line x1="150" y1="150" x2="150" y2="116" stroke="#5F5E5A" stroke-width="1"/>
<rect x="128" y="100" width="44" height="16" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="130" y1="102" x2="170" y2="114" stroke="#D85A30" stroke-width="1.5"/>
